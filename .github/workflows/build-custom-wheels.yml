name: build-custom-wheels

# Manual builder for the patched lancedb wheels (ICU + custom_stop_words).
# Builds manylinux x86_64 (native) and aarch64 (native ARM runner) release
# wheels and uploads them as downloadable artifacts (no PyPI publish).
#   gh workflow run build-custom-wheels.yml --ref main

on:
  workflow_dispatch:
    inputs:
      python-minor-version:
        description: "CPython minor version (10-13). abi3 wheel works across >= this."
        required: false
        default: "10"

jobs:
  build:
    name: "build ${{ matrix.arch }}"
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-24.04
            arm-build: "false"
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
            arm-build: "true"
    defaults:
      run:
        shell: bash
        working-directory: python
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: ./.github/workflows/build_linux_wheel
        with:
          python-minor-version: ${{ inputs.python-minor-version }}
          args: "--release"
          arm-build: ${{ matrix.arm-build }}
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: lancedb-wheel-${{ matrix.arch }}
          path: |
            target/wheels/*.whl
            python/target/wheels/*.whl
          if-no-files-found: error
