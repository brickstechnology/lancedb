name: build-custom-wheels

# Manual builder for the patched lancedb wheels (ICU + custom_stop_words).
# Produces manylinux x86_64 AND aarch64 release wheels and uploads them as
# downloadable artifacts (no PyPI publish). Run from the Actions tab or:
#   gh workflow run build-custom-wheels.yml --ref feat/expose-custom-stop-words

on:
  workflow_dispatch:
    inputs:
      python-minor-version:
        description: "CPython minor version (10-13). abi3 wheel works across >= this."
        required: false
        default: "10"

jobs:
  build:
    name: "build ${{ matrix.arch }}"
    # Build each arch on a NATIVE runner. aarch64 used to cross-compile under
    # QEMU on an x86_64 host, which exhausted resources and failed (exit 101)
    # ~30 min into compiling the lance/datafusion tree. GitHub-hosted ubuntu-arm
    # runners (free for public repos) build aarch64 natively with no emulation.
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            arm-build: "false"
            runs-on: ubuntu-24.04
          - arch: aarch64
            arm-build: "true"
            runs-on: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
        working-directory: python
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: ./.github/workflows/build_linux_wheel
        with:
          python-minor-version: ${{ inputs.python-minor-version }}
          args: "--release"
          arm-build: ${{ matrix.arm-build }}
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: lancedb-wheel-${{ matrix.arch }}
          path: python/target/wheels/*.whl
          if-no-files-found: error
