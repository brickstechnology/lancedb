name: build-custom-wheels

# Manual builder for the patched lancedb wheels (ICU + custom_stop_words).
# Produces manylinux x86_64 AND aarch64 release wheels and uploads them as
# downloadable artifacts (no PyPI publish). Run from the Actions tab or:
#   gh workflow run build-custom-wheels.yml --ref feat/expose-custom-stop-words

on:
  workflow_dispatch:
    inputs:
      python-minor-version:
        description: "CPython minor version (10-13). abi3 wheel works across >= this."
        required: false
        default: "10"

jobs:
  build:
    name: "build ${{ matrix.arch }}"
    # Build each arch on a NATIVE Blacksmith runner. aarch64 used to cross-compile
    # under QEMU on an x86_64 host (exit 101 ~30 min in). The default release
    # profile links _lancedb with fat LTO / codegen-units=1, whose peak memory
    # OOMs a 4-vcpu/16 GB runner — so use the 8-vcpu/~32 GB tier (like upstream's
    # ubuntu-2404-8x runners) and keep the full fat-LTO optimization.
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            arm-build: "false"
            runs-on: blacksmith-8vcpu-ubuntu-2404
          - arch: aarch64
            arm-build: "true"
            runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    defaults:
      run:
        shell: bash
        working-directory: python
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: ./.github/workflows/build_linux_wheel
        with:
          python-minor-version: ${{ inputs.python-minor-version }}
          args: "--release"
          arm-build: ${{ matrix.arm-build }}
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: lancedb-wheel-${{ matrix.arch }}
          # The cargo workspace target dir (and maturin's wheel output) is at the
          # repo root, not under python/, even though the build runs in python/.
          path: target/wheels/*.whl
          if-no-files-found: error
